<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Axum Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 380px; margin: 80px auto; padding: 0 20px; background: #0989c9; 
            background-image: url("/images/stars.gif"); background-size: cover;}
        form { display: grid; gap: 12px; padding: 24px; background: white; border-radius: 8px; }
        input, button { box-sizing: border-box; padding: 10px; font-size: 1rem; }
        button { cursor: pointer; }
        #error { min-height: 1.2em; color: #b00020; }
    </style>
</head>
<body>
    <form id="register-form">
        <h2>Register for chat</h2>
        <input name="username" placeholder="Username" autocomplete="username" required>
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Register</button>
        <button type="login" onclick="window.location.href = '/'">Login</button>
        <div id="error" role="alert"></div>
    </form>
    <script>
        const form = document.getElementById("register-form");
        const error = document.getElementById("error");
        const buttons = form.getElementsByTagName("button");
        const inputs = form.getElementsByTagName("input");
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            error.textContent = "";
            const response = await fetch("/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(Object.fromEntries(new FormData(form)))
            });
            if (response.ok) {
                window.location.href = "/";
            } else {
                clearInputs();
                error.textContent = response.status === 401
                    ? "Invalid username or password."
                    : response.status === 409
                    ? "Username already exists."
                    : "Unable to register. Please try again.";
            }
        });
        function clearInputs() {
            for (let i = 0; i < inputs.length; i++) {
                inputs[i].value = ''; // Sets the value to empty
            }
        };
    </script>
</body>
</html>
