<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Axum Chat Room</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; max-height: 900px; margin: 40px auto; padding: 0 20px; background-color: #0989c9; 
            background-image: url("/images/stars.gif"); background-size: cover;}
        #chat { height: 300px; border: 1px solid #0989c9; background-color: white; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        #input-container { display: flex; gap: 10px; }
        #message { flex-grow: 1; padding: 8px; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <h2 style="color: azure;" id="header"></h2>
    <div id="input-container">
        <input type="text" id="message" placeholder="Type a message..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>
    <div id="chat"></div>
    <div id="Logout"> 
        <button onclick="window.location.href = '/'">Logout</button>
        <button onclick="window.location.href = '/server_pathing'">Servers</button>
    </div>

    <script>
        const serverName = decodeURIComponent(window.location.pathname.split("/").pop());
        const protocol = location.protocol === "https:" ? "wss" : "ws";
        document.getElementById("header").textContent = serverName + " Server Chat";

        // Connect to your Axum WebSocket server
        const ws = new WebSocket(`${protocol}://${location.host}/ws?server_name=${encodeURIComponent(serverName)}`);
        const chatDiv = document.getElementById("chat");
        const messageInput = document.getElementById("message");

        // Listen for broadcasted messages from the server
        ws.onmessage = (event) => {
            const msgParagraph = document.createElement("p");
            msgParagraph.textContent = event.data;
            chatDiv.appendChild(msgParagraph);
            chatDiv.scrollTop = chatDiv.scrollHeight; // Auto-scroll to bottom
        };

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text && ws.readyState === WebSocket.OPEN) {
                ws.send(text);
                messageInput.value = "";
            }
        }

        // Allow pressing "Enter" to send
        messageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
