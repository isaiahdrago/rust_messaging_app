<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Server</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; max-height: 700px; margin: 80px auto; padding: 0 20px; background: #0989c9; 
            background-image: url("/images/stars.gif"); background-size: cover;}
        form { display: grid; gap: 12px; padding: 24px; background: white; border-radius: 8px; }
        input, button { box-sizing: border-box; padding: 10px; font-size: 1rem; }
        button { cursor: pointer; }
        #error { min-height: 1.2em; color: #b00020; }
    </style>
</head>
<body>
    <form id="delete-form">
        <h2>Delete Server</h2>
        <input name="server" placeholder="Server Name" required>
        <button type="submit">Delete Server</button>
        <button type="button" onclick="window.location.href = '/server_pathing'">Servers</button>
        <div id="error" role="alert"></div>
    </form>
    <script>
        const form = document.getElementById("delete-form");
        const error = document.getElementById("error");
        const buttons = form.getElementsByTagName("button");
        const inputs = form.getElementsByTagName("input");
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            error.textContent = "";

            const server = form.elements.server.value.trim();
            const confirmed = window.confirm(
                `Are you sure you would like to delete the server "${server}"? This cannot be undone.`
            );

            if (!confirmed) {
                return;
            }

            const response = await fetch("/delete_server", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(Object.fromEntries(new FormData(form)))
            });
            if (response.ok) {
                window.location.href = "/server_pathing";
            } else {
                clearInputs();
                error.textContent = response.status === 401
                    ? "Invalid server name."
                    : "Unable to delete server. Please try again.";
            }
        });

        function clearInputs() {
            for (let i = 0; i < inputs.length; i++) {
                inputs[i].value = ''; // Sets the value to empty
            }
        };
    </script>
</body>
</html>
