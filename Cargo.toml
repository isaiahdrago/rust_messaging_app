[package]
name = "rust_messaging_app"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = {version = "0.8.9", features = ["ws"]}
futures-util = "0.3.34"
serde = "1.0.229"
uuid = { version = "1.18.1", features = ["v4"] }
sqlx = {version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "sqlite", "macros"] }
tokio = {version = "1.53.2", features = ["full"]}
tower-http = {version = "0.7.1", features = ["fs"]}
